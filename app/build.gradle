
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ff.floatingmenu'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ff.floatingmenu'
        minSdk 26
        targetSdk 32
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
